name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telehealth_billing
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: telehealth_billing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # A model change without its migration is a deploy that fails at 3am. Checking here
      # is the cheapest place to catch it.
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          # CI-only values. A real deployment reads these from its own secret store.
          DJANGO_SECRET_KEY: ci-only-secret-key-long-enough-for-the-deploy-check-to-pass-0123456789
          DJANGO_ALLOWED_HOSTS: billing.example.com
          INTERNAL_SERVICE_TOKEN: ci-internal-token
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
        run: uv run python manage.py check --deploy --fail-level WARNING

      - name: Tests
        run: uv run pytest

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen

      # Generating the schema is also a check: --validate fails on a spec that would not
      # round-trip, and --fail-on-warn fails on a view drf-spectacular cannot describe.
      - name: Generate the OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run python manage.py spectacular --validate --fail-on-warn --file openapi.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.yaml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
